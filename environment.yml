# Exact environment used for all IIM / zero-shot results in this repo.
#
#   conda env create -f environment.yml
#   conda activate iim-smcm
#   pip install -e Dassl          # vendored Dassl fork (not on PyPI)
#
# Tested with Python 3.13 + torch 2.11 (CUDA 13.0 wheels) on a single
# RTX 5090 (32 GB).  Lower CUDA versions work too -- reinstall torch with the
# matching --index-url, e.g.
#   pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu126
name: iim-smcm
channels:
  - conda-forge
  - defaults
